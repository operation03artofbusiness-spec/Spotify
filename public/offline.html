<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Offline</title>
    <style>
      body {
        background: #0b0b0f;
        color: #ffffff;
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        max-width: 480px;
        padding: 32px;
        border-radius: 24px;
        background: #121217;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Your cached songs are still available. Reconnect to sync your library.</p>
    </div>
  </body>
</html>
